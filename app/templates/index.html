{% extends 'base.html' %}
{% block content %}
<div class="h-full flex items-center justify-center p-6">
    <div class="w-full max-w-md">

        <!-- Title -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold text-zinc-100 mb-1">Unggah Dokumen</h1>
            <p class="text-sm text-muted">Catatan, email, atau chat export (.txt, .pdf, .docx)</p>
        </div>

        <!-- Upload Form -->
        <form id="upload-form"
              hx-post="/web/upload"
              hx-target="body"
              hx-swap="innerHTML"
              enctype="multipart/form-data"
              x-data="{
                files: [],
                dragging: false,
                processing: false,
                progress: { current: 0, total: 0, done: true },
                _poll: null,
                get progressPct() {
                  if (!this.progress.total) return 0;
                  return Math.round((this.progress.current / this.progress.total) * 100);
                },
                startPolling() {
                  this.processing = true;
                  this.progress = { current: 0, total: 0, done: false };
                  this._poll = setInterval(async () => {
                    try {
                      const r = await fetch('/api/progress');
                      const p = await r.json();
                      this.progress = p;
                      if (p.done) this.stopPolling();
                    } catch {}
                  }, 400);
                },
                stopPolling() { clearInterval(this._poll); this._poll = null; this.processing = false; },
                get shown() { return this.files.slice(0, 6); },
                get extra() { return Math.max(0, this.files.length - 6); },
                ext(name) {
                  const m = name.match(/\.([^.]+)$/);
                  return m ? m[1].toUpperCase() : 'FILE';
                },
                chipBorder(name) {
                  const e = (name.match(/\.([^.]+)$/) || ['',''])[1].toLowerCase();
                  if (e === 'pdf')  return '#7f1d1d';
                  if (e === 'docx' || e === 'doc') return '#1e3a6e';
                  return '#3f3f46';
                },
                badgeStyle(name) {
                  const e = (name.match(/\.([^.]+)$/) || ['',''])[1].toLowerCase();
                  if (e === 'pdf')  return 'background:#3f0000;color:#f87171;';
                  if (e === 'docx' || e === 'doc') return 'background:#0c1832;color:#93c5fd;';
                  return 'background:#27272a;color:#a1a1aa;';
                },
                basename(name) {
                  return name.replace(/\.[^.]+$/, '');
                }
              }"
              @htmx:beforeRequest.window="if ($event.detail.elt === $el) { startPolling(); }"
              @htmx:afterRequest.window="stopPolling()"
              @dragover.prevent="dragging = true"
              @dragleave.prevent="dragging = false"
              @drop.prevent="dragging = false; files = Array.from($event.dataTransfer.files); $el.querySelector('input[type=file]').files = $event.dataTransfer.files">

            <!-- Drop Zone -->
            <label :class="dragging ? 'border-indigo-500 bg-indigo-500/5' : 'border-border hover:border-subtle'"
                   class="flex flex-col items-center justify-center gap-3 h-48 rounded-xl border-2 border-dashed cursor-pointer transition-colors">

                <svg class="w-8 h-8 text-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.338-2.32 3 3 0 0 1 3.48 3.43 4.5 4.5 0 0 1-.89 7.665"/>
                </svg>

                <div class="text-center">
                    <template x-if="files.length === 0">
                        <div>
                            <p class="text-sm text-zinc-300">Seret file ke sini atau <span class="text-indigo-400">pilih file</span></p>
                            <p class="text-xs text-muted mt-1">Maksimal 10 file · 10 MB per file</p>
                        </div>
                    </template>
                    <template x-if="files.length > 0">
                        <p class="text-sm text-indigo-400 font-medium" x-text="files.length + ' file dipilih'"></p>
                    </template>
                </div>

                <input type="file" name="files" multiple class="hidden"
                       @change="files = Array.from($event.target.files)"/>
            </label>

            <!-- File List Preview: typed chips, max 6 shown -->
            <template x-if="files.length > 0">
                <div class="mt-3 flex flex-wrap gap-2">

                    <template x-for="f in shown" :key="f.name">
                        <div class="flex items-center gap-0 text-xs rounded-lg overflow-hidden border"
                             :style="`border-color:${chipBorder(f.name)};max-width:220px;`"
                             style="background:#1a1a1e;">
                            <!-- Extension badge -->
                            <span class="shrink-0 px-2 py-1.5 font-bold tracking-wide"
                                  style="font-size:9px;letter-spacing:0.05em;"
                                  :style="badgeStyle(f.name)"
                                  x-text="ext(f.name)">
                            </span>
                            <!-- Filename without extension, truncated -->
                            <span class="px-2 py-1.5 truncate text-zinc-400"
                                  x-text="basename(f.name)">
                            </span>
                        </div>
                    </template>

                    <!-- Overflow count badge -->
                    <template x-if="extra > 0">
                        <div class="flex items-center px-3 py-1.5 rounded-lg border text-xs text-zinc-500"
                             style="border-color:#3f3f46;background:#1a1a1e;"
                             x-text="`+${extra} lainnya`">
                        </div>
                    </template>

                </div>
            </template>

            <!-- Submit Button -->
            <button type="submit"
                    :disabled="files.length === 0 || processing"
                    :class="(files.length === 0 || processing) ? 'opacity-40 cursor-not-allowed' : 'hover:bg-indigo-500 cursor-pointer'"
                    class="mt-5 w-full bg-indigo-600 text-white text-sm font-medium rounded-lg h-10 transition-colors htmx-indicator-hide">
                Process
            </button>

            <!-- Progress -->
            <div class="htmx-indicator mt-5">
                <!-- Progress bar -->
                <template x-if="progress.total > 0">
                    <div>
                        <div class="flex justify-between text-xs text-muted mb-1">
                            <span>Enriching chunk <span x-text="progress.current"></span> / <span x-text="progress.total"></span></span>
                            <span x-text="progressPct + '%'"></span>
                        </div>
                        <div class="w-full rounded-full h-1.5" style="background:#2e2e35;">
                            <div class="h-1.5 rounded-full transition-all duration-300" style="background:#6366f1;"
                                 :style="'width:' + progressPct + '%'"></div>
                        </div>
                    </div>
                </template>
                <!-- Spinner saat belum ada progress total -->
                <template x-if="progress.total === 0">
                    <div class="flex items-center justify-center gap-2 text-muted text-sm">
                        <svg class="w-4 h-4 animate-spin text-indigo-400" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                        </svg>
                        <span>Mempersiapkan...</span>
                    </div>
                </template>
            </div>
        </form>
    </div>
</div>
<style>.htmx-request .htmx-indicator-hide { display: none; }</style>
{% endblock %}
