<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indonesian Doc Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              surface:  '#18181b',
              panel:    '#1f1f23',
              border:   '#2e2e35',
              muted:    '#71717a',
              subtle:   '#3f3f46',
            }
          }
        }
      }
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.11" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/cdn.min.js"></script>
    <style>
      body { background: #18181b; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; }
      .htmx-indicator { opacity: 0; transition: opacity 150ms ease; }
      .htmx-request .htmx-indicator { opacity: 1; }
      .htmx-request.htmx-indicator { opacity: 1; }
      .chat-scroll { scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; }
      .chat-scroll::-webkit-scrollbar { width: 4px; }
      .chat-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
      .prose p { margin-bottom: 0.5rem; line-height: 1.6; }
      .prose strong { color: #f4f4f5; }
      .prose ul { list-style: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .slide-up { animation: slideUp 0.2s ease forwards; }
      /* Keyword highlight in source excerpt */
      mark.hl { background: transparent; color: #a5b4fc; font-weight: 600; font-style: normal; }
      /* Typing bubble dots */
      .typing-dot {
        display: inline-block; width: 6px; height: 6px;
        background: #4f46e5; border-radius: 50%;
        animation: typingBounce 1.2s infinite ease-in-out;
      }
      .typing-dot:nth-child(2) { animation-delay: 0.2s; }
      .typing-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes typingBounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
        30% { transform: translateY(-5px); opacity: 1; }
      }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="shrink-0 h-12 flex items-center px-5 border-b border-border bg-panel">
        <span class="text-sm font-semibold tracking-tight">
            <span class="text-indigo-400">Indonesian</span><span class="text-zinc-100"> Doc Intelligence [ DEMO ]</span>
        </span>
        <div class="ml-auto flex items-center gap-2">
            <a href="http://github.com/qrizan/indonesian-document-intelligence" target="_blank" rel="noopener"
               class="flex items-center gap-1.5 text-xs border rounded px-3 py-1 transition-colors"
               style="color:#a1a1aa;border-color:#2e2e35;"
               onmouseover="this.style.borderColor='#6366f1';this.style.color='#c7d2fe';"
               onmouseout="this.style.borderColor='#2e2e35';this.style.color='#a1a1aa';">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                GitHub
            </a>
        </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-hidden">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
