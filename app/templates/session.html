<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indonesian Doc Intelligence</title>
    <script src="https://unpkg.com/htmx.org@1.9.11" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/cdn.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; height: 100vh; overflow: hidden; background: #18181b; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
      .htmx-indicator { opacity: 0; transition: opacity 150ms ease; }
      .htmx-request .htmx-indicator { opacity: 1; }
      .htmx-request.htmx-indicator { opacity: 1; }
      .chat-scroll { scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; }
      .chat-scroll::-webkit-scrollbar { width: 4px; }
      .chat-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
      .prose p { margin-bottom: 0.5rem; line-height: 1.6; }
      .prose strong { color: #f4f4f5; }
      .prose ul { list-style: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
      @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .slide-up { animation: slideUp 0.2s ease forwards; }
      mark.hl { background: transparent; color: #a5b4fc; font-weight: 600; font-style: normal; }
      .typing-dot { display: inline-block; width: 6px; height: 6px; background: #4f46e5; border-radius: 50%; animation: typingBounce 1.2s infinite ease-in-out; }
      .typing-dot:nth-child(2) { animation-delay: 0.2s; }
      .typing-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.35; } 30% { transform: translateY(-5px); opacity: 1; } }
    </style>
</head>
<body>{% include 'components/upload_success.html' %}
</body>
</html>
